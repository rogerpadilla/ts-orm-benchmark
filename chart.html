<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TS ORM Benchmark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Helvetica, 'Apple Color Emoji', Arial, sans-serif, 'Segoe UI Emoji', 'Segoe UI Symbol';
      background: #0a0a0f;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      max-width: 840px;
      width: 100%;
      background: linear-gradient(145deg, #12131a 0%, #0d0e14 100%);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 48px 52px 40px;
      box-shadow: 0 0 80px rgba(88, 166, 255, 0.04);
    }

    .header { text-align: center; margin-bottom: 24px; }

    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #58a6ff 0%, #a371f7 50%, #f778ba 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p { color: #6e7681; font-size: 14px; font-weight: 500; }

    .tabs {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 28px;
      padding: 4px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
    }

    .tab {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #6e7681;
      background: transparent;
      padding: 8px 18px;
      border-radius: 9px;
      transition: color .15s, background .15s;
    }

    .tab:hover { color: #b1bac4; }

    .tab[aria-selected="true"] {
      color: #e6edf3;
      background: rgba(255,255,255,0.06);
    }

    .category { margin-bottom: 20px; }
    .category:last-child { margin-bottom: 0; }

    .category-label {
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .winner-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .bars { display: flex; flex-direction: column; gap: 4px; }

    .bar-row { display: flex; align-items: center; height: 28px; }

    .bar-name {
      width: 132px;
      font-size: 12px;
      font-weight: 700;
      color: #6e7681;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bar-name a { color: inherit; text-decoration: none; }
    .bar-name a:hover { text-decoration: underline; }
    .bar-name img { width: 16px; height: 16px; border-radius: 4px; }

    .bar-name .variant {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .bar-track {
      flex: 1;
      height: 22px;
      background: rgba(255,255,255,0.02);
      border-radius: 6px;
      display: flex;
      align-items: center;
    }

    /* One rule for every entry: the hue comes from `--c`, so adding an entry needs no new CSS. */
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, #101018) 0%, var(--c) 100%);
      min-width: 4px;
    }

    .bar-value {
      padding-left: 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .bar-row.is-winner .bar-name { color: #e6edf3; }

    /* A reference floor is drawn but visibly not competing. */
    .bar-row.is-baseline .bar-name { font-style: italic; font-weight: 600; }
    .bar-row.is-baseline .bar-fill { opacity: 0.4; }

    .bar-row.is-absent .bar-track { opacity: 0.35; }
    .bar-row.is-absent .bar-value { color: #484f58; font-weight: 600; }

    .footer {
      margin-top: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.04);
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-left { display: flex; gap: 18px; flex-wrap: wrap; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #6e7681;
      font-weight: 500;
    }

    .legend-item a { color: inherit; text-decoration: none; }
    .legend-item a:hover { text-decoration: underline; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    .footer-right { font-size: 11px; color: #484f58; font-weight: 500; }

    .score { text-align: center; margin-top: 28px; margin-bottom: 4px; }
    .score-text { font-size: 16px; font-weight: 700; color: #8b949e; }
    .score-text .sep { color: #30363d; margin: 0 6px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>⚡ TypeScript ORM Benchmark</h1>
    <p id="subtitle"></p>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div id="categories"></div>

  <div class="score">
    <span class="score-text" id="score"></span>
  </div>

  <div class="footer">
    <div class="footer-left" id="legend"></div>
    <div class="footer-right">Node.js v24 · Apple Silicon · github.com/rogerpadilla/ts-orm-benchmark</div>
  </div>
</div>

<script src="results.js"></script>
<script>
  const { datasets } = window.BENCH;

  /**
   * Keyed by base name. A driver variant like `UQL (bunSql)` resolves to the same entry, because it is
   * the same query builder reached through a different driver: giving it its own colour would read as a
   * separate contender.
   */
  const ENTRY_META = {
    UQL:         { color: '#5b6abf', logo: 'assets/uql-icon.svg',                                    url: 'https://uql-orm.dev' },
    Sequelize:   { color: '#02afef', logo: 'https://avatars.githubusercontent.com/u/3591786?s=32',   url: 'https://sequelize.org' },
    TypeORM:     { color: '#ff7733', logo: 'https://avatars.githubusercontent.com/u/20165699?s=32',  url: 'https://typeorm.io' },
    MikroORM:    { color: '#1abc9c', logo: 'https://mikro-orm.io/img/logo.svg',                      url: 'https://mikro-orm.io' },
    Drizzle:     { color: '#7ab82d', logo: 'https://avatars.githubusercontent.com/u/108468352?s=32', url: 'https://orm.drizzle.team' },
    Knex:        { color: '#e24a33', logo: 'https://avatars.githubusercontent.com/u/3137232?s=32',   url: 'https://knexjs.org' },
    Kysely:      { color: '#c084fc', logo: 'https://avatars.githubusercontent.com/u/123764858?s=32', url: 'https://kysely.dev' },
    'raw pg':    { color: '#8b949e', logo: 'https://avatars.githubusercontent.com/u/2947298?s=32',   url: 'https://node-postgres.com' },
    'bun sql':   { color: '#a1a1aa', logo: 'https://avatars.githubusercontent.com/u/71667065?s=32',  url: 'https://bun.sh/docs/api/sql' },
  };

  const FALLBACK = { color: '#6e7681', logo: '', url: '#' };

  /** Splits `Drizzle (bunSql)` into the entry it styles as and the marker shown beside the name. */
  function describeEntry(name) {
    const match = /^(.*?)\s*\((.+)\)$/.exec(name);
    const base = match ? match[1] : name;
    return { base, variant: match ? match[2] : '', meta: ENTRY_META[base] ?? FALLBACK };
  }

  function present(values) {
    return values.filter((v) => v !== null);
  }

  function bestOf(values, lowerIsBetter) {
    const real = present(values);
    if (!real.length) return null;
    return lowerIsBetter ? Math.min(...real) : Math.max(...real);
  }

  function formatValue(value, dataset) {
    if (value === null) return 'n/a';
    if (dataset.lowerIsBetter) return `${value}µs`;
    return value >= 1000 ? `${(value / 1000).toFixed(1)}M` : `${value}K`;
  }

  /** Values with the reference floors blanked out, so "who won" only ever considers real contenders. */
  function contestedValues(dataset, values) {
    return values.map((v, i) => (dataset.baselines.includes(dataset.entries[i]) ? null : v));
  }

  /**
   * Bar length always means "better", in both directions: throughput scales by `value / best`, latency by
   * `best / value`. Keeping the longest bar the winner in both datasets avoids a chart where the reader
   * has to remember which way round this one is.
   */
  function fraction(value, best, lowerIsBetter) {
    if (value === null || best === null) return 0;
    return lowerIsBetter ? best / value : value / best;
  }

  function renderBars(container, dataset, values) {
    const best = bestOf(values, dataset.lowerIsBetter);

    const ordered = values
      .map((value, i) => ({ value, i }))
      .sort((a, b) => {
        if (a.value === null) return 1;
        if (b.value === null) return -1;
        return dataset.lowerIsBetter ? a.value - b.value : b.value - a.value;
      });

    for (const { value, i } of ordered) {
      const name = dataset.entries[i];
      const { variant, meta } = describeEntry(name);
      const isBaseline = dataset.baselines.includes(name);
      const pct = Math.max(fraction(value, best, dataset.lowerIsBetter) * 100, 3);

      const row = document.createElement('div');
      row.className = [
        'bar-row',
        value !== null && value === best && !isBaseline ? 'is-winner' : '',
        isBaseline ? 'is-baseline' : '',
        value === null ? 'is-absent' : '',
      ].filter(Boolean).join(' ');

      row.innerHTML = `
        <span class="bar-name" style="color:${meta.color}">
          ${meta.logo ? `<img src="${meta.logo}" alt="">` : ''}
          <a href="${meta.url}" target="_blank" rel="noopener">${describeEntry(name).base}</a>
          ${variant ? `<span class="variant">${variant}</span>` : ''}
        </span>
        <div class="bar-track">
          ${value === null ? '' : `<div class="bar-fill" style="--c:${meta.color};width:${pct}%"></div>`}
          <span class="bar-value" style="color:${meta.color}">${formatValue(value, dataset)}</span>
        </div>
      `;
      container.appendChild(row);
    }
  }

  function renderDataset(dataset) {
    document.getElementById('subtitle').textContent =
      `${dataset.blurb} ${dataset.unit} · ${dataset.lowerIsBetter ? 'lower' : 'higher'} = better`;

    const root = document.getElementById('categories');
    root.innerHTML = '';

    for (const { key, label } of dataset.categories) {
      const values = dataset.data[key];

      // The gap to the runner-up, so the badge says how decisive the win was rather than just who won.
      const contenders = contestedValues(dataset, values)
        .map((value, i) => ({ value, i }))
        .filter(({ value }) => value !== null)
        .sort((a, b) => (dataset.lowerIsBetter ? a.value - b.value : b.value - a.value));

      const winner = contenders[0];
      const runnerUp = contenders[1];
      const badge = winner && runnerUp
        ? `${describeEntry(dataset.entries[winner.i]).base} ${(dataset.lowerIsBetter
            ? runnerUp.value / winner.value
            : winner.value / runnerUp.value).toFixed(2)}x`
        : '';
      const badgeColor = winner ? describeEntry(dataset.entries[winner.i]).meta.color : FALLBACK.color;

      const category = document.createElement('div');
      category.className = 'category';
      category.innerHTML = `
        <div class="category-label">${label}
          ${badge ? `<span class="winner-badge" style="background:${badgeColor}26;color:${badgeColor}">${badge}</span>` : ''}
        </div>
        <div class="bars"></div>
      `;
      root.appendChild(category);
      renderBars(category.querySelector('.bars'), dataset, values);
    }

    const wins = dataset.entries.map(() => 0);
    for (const { key } of dataset.categories) {
      // Baselines are dropped *before* the best is picked, matching the README. Picking the best across
      // everything and then looking for a competitor that ties it left every entry on zero, since
      // hand-written driver code wins nearly every round-trip step.
      const contested = contestedValues(dataset, dataset.data[key]);
      const best = bestOf(contested, dataset.lowerIsBetter);
      if (best === null) continue;
      wins[contested.indexOf(best)]++;
    }

    const topIdx = wins.indexOf(Math.max(...wins));
    const topMeta = describeEntry(dataset.entries[topIdx]).meta;
    document.getElementById('score').innerHTML = `
      <span style="color:${topMeta.color}">${dataset.entries[topIdx]} ${wins[topIdx]}/${dataset.categories.length}</span>
      <span class="sep">·</span>
      ${dataset.label}
    `;

    document.getElementById('legend').innerHTML = dataset.entries.map((name) => {
      const { meta } = describeEntry(name);
      return `<div class="legend-item"><div class="legend-dot" style="background:${meta.color}"></div><a href="${meta.url}" target="_blank" rel="noopener">${name}</a></div>`;
    }).join('');
  }

  const tabs = document.getElementById('tabs');
  datasets.forEach((dataset, i) => {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.type = 'button';
    tab.role = 'tab';
    tab.textContent = dataset.label;
    tab.setAttribute('aria-selected', String(i === 0));
    tab.addEventListener('click', () => {
      for (const other of tabs.children) other.setAttribute('aria-selected', 'false');
      tab.setAttribute('aria-selected', 'true');
      renderDataset(dataset);
    });
    tabs.appendChild(tab);
  });

  // A single dataset needs no switcher.
  tabs.hidden = datasets.length < 2;
  renderDataset(datasets[0]);
</script>

</body>
</html>
