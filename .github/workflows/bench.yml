name: Bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Published numbers are produced locally on Apple Silicon, so consistent hardware rather than a shared
  # runner decides them. This job proves the lifecycle still runs and still agrees with the database:
  # `--verify` keeps every step's assertions on and writes nothing, since three iterations on a CI runner
  # say nothing about speed. To update the report: `npm run bench`, locally.
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bunx biome check
      - run: bun scripts/flow-bench.ts --iterations 3 --verify
      # Costs nothing on a shared runner and is the half of the report a CI job can actually decide: a
      # probe that stopped erroring, or a correction that stopped compiling, is a finding either way.
      - run: bun scripts/type-check.ts --verify
      # The runtime comparison only holds if the benchmark still loads without Bun's SQL client, which a
      # static `from 'bun'` anywhere would quietly break.
      - run: bun build scripts/flow-bench.ts --target=node --packages=external --outdir=.bench-build
      - run: node .bench-build/flow-bench.js --iterations 3 --verify

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site
          cp chart.html results.js README.md _site/
          cp -r assets _site/assets 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
